services:
  api:
    ports: !reset []
    environment:
      CORS_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-dania:16k}
  worker:
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-dania:16k}
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
volumes:
  caddy_data:
  caddy_config:
